<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 395" width="300" height="395">
  <!-- Anniversary pennant — club-neutral auction artwork, styled after the
       rewards catalogue set (portrait card, echo type, confetti, sparkle). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a2c"/>
      <stop offset="1" stop-color="#081f16"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f1df"/>
      <stop offset="1" stop-color="#e3d9bd"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="300" height="395" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="300" height="395" fill="url(#bg)"/>
    <!-- echo type -->
    <g fill="#ffffff" opacity="0.06" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="60" letter-spacing="4">
      <text x="-10" y="52">LEGACY</text>
      <text x="52" y="384">LEGACY</text>
      <text x="250" y="42" transform="rotate(90 250 42)">LEGACY</text>
    </g>
    <!-- confetti -->
    <g>
      <rect x="46" y="96" width="9" height="4" rx="2" fill="#e8c05a" transform="rotate(24 50 98)"/>
      <rect x="242" y="120" width="10" height="4" rx="2" fill="#ffffff" opacity="0.8" transform="rotate(-28 247 122)"/>
      <rect x="224" y="322" width="9" height="4" rx="2" fill="#e8c05a" transform="rotate(36 228 324)"/>
      <circle cx="70" cy="150" r="2.5" fill="#ffffff" opacity="0.8"/>
      <circle cx="240" cy="212" r="3" fill="#e8c05a"/>
      <circle cx="58" cy="300" r="2.5" fill="#e8c05a"/>
    </g>
    <g transform="translate(0 6)">
      <!-- hanging rod + cord -->
      <path d="M84 74 Q150 50 216 74" fill="none" stroke="#a8823e" stroke-width="4" stroke-linecap="round"/>
      <rect x="66" y="70" width="168" height="10" rx="5" fill="#c9a355"/>
      <circle cx="66" cy="75" r="8" fill="#e8c05a"/>
      <circle cx="234" cy="75" r="8" fill="#e8c05a"/>
      <!-- pennant body, hanging point-down -->
      <path d="M86 88 L214 88 L150 330 Z" fill="#000" opacity="0.3" transform="translate(5 9)"/>
      <path d="M86 88 L214 88 L150 330 Z" fill="url(#cloth)"/>
      <path d="M86 88 L214 88 L150 330 Z" fill="none" stroke="#123a2c" stroke-width="5"/>
      <path d="M97 100 L203 100 L150 300 Z" fill="none" stroke="#a8823e" stroke-width="2.5"/>
      <!-- crest roundel -->
      <circle cx="150" cy="146" r="30" fill="#123a2c"/>
      <circle cx="150" cy="146" r="24" fill="none" stroke="#e8c05a" stroke-width="2.5"/>
      <path d="M150 132 l4.2 9 9.8 1 -7.3 6.6 2.1 9.6 -8.8 -5 -8.8 5 2.1 -9.6 -7.3 -6.6 9.8 -1 z" fill="#e8c05a"/>
      <!-- anniversary text -->
      <text x="150" y="208" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="#123a2c" letter-spacing="1">EST.</text>
      <text x="150" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#123a2c" letter-spacing="2">1926</text>
      <!-- 100 laurel dashes -->
      <path d="M128 258 Q150 268 172 258" fill="none" stroke="#a8823e" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- sparkle -->
    <path d="M272 362 l4.5 10 10 4.5 -10 4.5 -4.5 10 -4.5 -10 -10 -4.5 10 -4.5 z" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
